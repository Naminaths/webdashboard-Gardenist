<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Smart garden greenhouse dashboard illustration</title>
  <desc id="desc">A bright greenhouse with garden beds, IoT sensors, water pipes, and a small monitoring panel.</desc>
  <defs>
