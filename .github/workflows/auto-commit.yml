name: Auto Commit & Sync

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Pesan commit khusus (opsional)'
        required: false
        default: 'chore(auto): automated repository sync and updates'
  schedule:
    # Berjalan mingguan setiap hari Minggu pukul 00:00 UTC untuk memeriksa & sync repositori
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  auto_commit:
    name: Auto Commit Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Validate
        run: npm run build

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ github.event.inputs.commit_message || 'chore(auto): automated repository sync and updates' }}
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          skip_dirty_check: false
