name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: "${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBoPQqYYAf2qjNCNur0IqQMiCj-sLyWvOs' }}"
      VITE_FIREBASE_AUTH_DOMAIN: "webdashboard-gardenist.firebaseapp.com"
      VITE_FIREBASE_DATABASE_URL: "https://webdashboard-gardenist-default-rtdb.firebaseio.com"
      VITE_FIREBASE_PROJECT_ID: "webdashboard-gardenist"
      VITE_FIREBASE_STORAGE_BUCKET: "webdashboard-gardenist.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "608799094403"
      VITE_FIREBASE_APP_ID: "1:608799094403:web:0ac4b0e8ff3b72c660cdb6"
      VITE_FIREBASE_MEASUREMENT_ID: "G-VL7W2Z6ECV"
    steps:
      - uses: actions/checkout@v4
      
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBDASHBOARD_GARDENIST }}
          projectId: webdashboard-gardenist
